<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGO MOVE</title>

<script src="config.js"></script><script src="shim.js"></script><script type="module" src="firebase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffbe9; --card:#ffffff; --ink:#1c2654; --sub:#6c7088; --line:#efe7c8;
  --accent:#1c2654; --accent-soft:#fff1b3; --good:#1f9d6b; --good-soft:#e2f5ec; --bad:#d9433b; --bad-soft:#fde8e6;
  --gold:#e8b73a; --silver:#a9b0bb; --bronze:#c98552; --blue:#3b6fe0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f6efd3;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:28px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.logo{font-weight:900;font-size:19px;letter-spacing:-.5px}
.logo span{background:#ffe98a;padding:1px 7px;border-radius:7px}
.pill-btn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--ink);color:#fff}
.pill-btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.screen{padding:4px 16px 16px}
h2{font-size:22px;font-weight:900;letter-spacing:-.6px;margin:10px 4px 4px}
.lead{color:var(--sub);font-size:14px;margin:0 4px 14px;line-height:1.5}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h3{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-size:12px;color:var(--sub);font-weight:500}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#3a3a40}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--ink)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;margin-top:14px}
.btn.accent{background:var(--accent)}
.btn.light{background:#fff1b3;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;background:#fff;color:#3a3a40}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.good.on{background:var(--good);border-color:var(--good)}
.chip.bad.on{background:var(--bad);border-color:var(--bad)}
.seg{display:flex;background:#f6efd3;border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#a3a2a8;padding:4px 0}
.nav button.on{color:var(--ink)}
.nav svg{width:22px;height:22px}
.stat{display:flex;gap:10px;margin-top:4px}
.stat div{flex:1;background:#fdf7df;border-radius:14px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--sub)}
.bar{height:10px;background:#f6efd3;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bagwrap{display:flex;justify-content:center;padding:6px 0}
.hero{background:linear-gradient(160deg,#161e45,#27357a);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.hero .muted{color:#c9cfee}
.hero h3{color:#fff}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #d6d4cd;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:10.5px;color:#b0aea7;font-weight:700;line-height:1.2;padding:4px;position:relative}
.stamp.on{border:none;color:#fff;transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stamp.on.cat-dist{background:#e0a82e} .stamp.on.cat-pace{background:var(--blue)} .stamp.on.cat-cons{background:var(--good)} .stamp.on.cat-race{background:#8a4fd8} .stamp.on.cat-mego{background:#1c2654}
.stamp b{font-size:13px;display:block}
.cat-title{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.race{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.race:first-child{border-top:none}
.race .date{min-width:48px;text-align:center;background:#fdf7df;border-radius:12px;padding:8px 4px}
.race .date b{display:block;font-size:18px;font-weight:900}
.race .date span{font-size:11px;color:var(--sub)}
.race .info{flex:1}
.race .info b{font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#f0eee9;color:#55555c;margin:4px 4px 0 0}
.tag.hot{background:#ffe98a;color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:none}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid #cfcdc6;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check.done .box{background:var(--good);border-color:var(--good)}
.check.done .nm{text-decoration:line-through;color:#a3a2a8}
.check .nm{font-weight:700;font-size:14.5px}
.check .why{font-size:12.5px;color:var(--sub);margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(15,15,18,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.cert{width:100%;max-width:330px;aspect-ratio:9/16;border-radius:22px;background:linear-gradient(170deg,#141b40 0%,#232f6b 60%,#ffe98a 150%);color:#fff;padding:26px 22px;display:flex;flex-direction:column;position:relative;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.cert .k{font-size:11px;letter-spacing:3px;color:#ffe98a;font-weight:700}
.cert .title{font-size:28px;font-weight:900;letter-spacing:-1px;margin-top:6px;line-height:1.15}
.cert .medal{margin:22px auto 10px}
.cert .rec{font-size:34px;font-weight:900;text-align:center;letter-spacing:-1px}
.cert .recsub{text-align:center;color:#c9c9cf;font-size:13px;margin-top:4px}
.cert .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:#c9c9cf}
.cert .foot b{color:#fff;font-size:15px;display:block}
.modal-actions{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:330px;display:flex;gap:8px;z-index:51}
.modal-actions .btn{margin:0}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:60;animation:fade .2s;max-width:90%}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .lb{width:104px;flex-shrink:0}
.hbar .tr{flex:1;height:14px;background:#f0eee9;border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px}
.hbar .n{width:28px;text-align:right;font-weight:700;color:var(--sub)}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sw small{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
.linecard{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:#fff}
.linecard.on{border-color:var(--ink)}
.linecard b{font-size:16px;font-weight:900}
.linecard p{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4}
.deco-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.deco{aspect-ratio:1;border-radius:14px;background:#fdf7df;display:flex;align-items:center;justify-content:center;border:2px solid transparent;position:relative}
.deco.on{border-color:var(--ink);background:#fff}
.deco em{position:absolute;bottom:-6px;font-size:9.5px;font-style:normal;font-weight:700;background:var(--ink);color:#ffe98a;border-radius:6px;padding:1px 5px}
.deco-grid{row-gap:14px}
.lockmsg{background:#fdf7df;border-radius:14px;padding:14px;font-size:13px;color:var(--sub);text-align:center}
.note{font-size:11.5px;color:#9b9aa0;margin-top:8px;line-height:1.5}
.ai-out{background:#faf9f6;border-radius:14px;padding:14px;margin-top:12px;font-size:14px;line-height:1.6}
.week{padding:10px 0;border-top:1px solid var(--line)}
.week:first-child{border-top:none}
.week b{font-size:14px}
.week ul{margin:4px 0 0 18px;font-size:13px;color:#45454b;line-height:1.6}
.big-num{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1}
.dday{position:absolute;right:18px;top:18px;background:#ffe98a;color:#1c2654;font-weight:900;font-size:13px;padding:6px 10px;border-radius:10px}
.hidden{display:none}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border-radius:20px;padding:18px 16px;text-align:left;min-height:122px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tile svg{width:30px;height:30px;margin-bottom:6px}
.tile b{font-size:16.5px;font-weight:900;letter-spacing:-.3px}
.tile span{font-size:12.5px;color:var(--sub);line-height:1.4}
.tile.main{grid-column:1/-1;background:var(--ink);color:#fff;min-height:0;flex-direction:row;align-items:center;gap:14px;padding:20px 18px}
.tile.main svg{margin:0;width:34px;height:34px;color:#ffe98a}
.tile.main span{color:#c9cfee}
.tile.main b{font-size:18px}
.staff{display:block;margin:6px auto 0;font-size:12.5px;color:var(--sub);text-decoration:underline;padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.cal-h{text-align:center;font-size:11.5px;color:var(--sub);font-weight:700;padding-bottom:2px}
.cal-d{aspect-ratio:1;border-radius:50%;border:1.5px dashed #e3dbb8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:#a9a48d;font-weight:700;line-height:1}
.cal-d small{font-size:6.5px;letter-spacing:.5px;margin-bottom:2px;color:#ffe98a}
.cal-d.on{border:none;background:var(--ink);color:#fff;transform:rotate(-8deg);box-shadow:0 2px 5px rgba(28,38,84,.25)}
.cal-d.today:not(.on){border:2px solid var(--ink);color:var(--ink)}
.medal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.medal-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border-radius:14px;background:#fdf7df;font-size:12px}
.medal-cell b{font-size:12.5px;margin-top:2px;text-align:center;line-height:1.3}
.medal-cell span{color:var(--sub);font-size:11px;text-align:center;line-height:1.35}
.medal-cell.off svg{filter:grayscale(1);opacity:.28}
.diary{padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.diary:first-child{border-top:none}
.g{color:var(--good);font-weight:700}.b{color:var(--bad);font-weight:700}

/* v10 */
.who{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.auth-hero{text-align:center;padding:10px 6px 18px}.auth-bag{display:inline-block;border-radius:24px;overflow:hidden}
.bagsw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px}
.bagsw button{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.bagsw button.on{border-color:var(--ink);color:var(--ink)}.bagsw i{width:11px;height:11px;border-radius:50%;border:1px solid #d6cfb2}
.mission-bar{display:block;width:100%;text-align:left;background:#fff4c2;border-radius:18px;padding:14px 16px;margin-bottom:12px}
.mtag{display:inline-block;font-size:11px;font-weight:900;background:var(--ink);color:#ffe98a;border-radius:6px;padding:2px 7px;margin-bottom:6px}
.mission-bar .mt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.mission-bar .mt b{font-size:15px}.mission-bar .mt span{font-size:12px;color:var(--sub);white-space:nowrap}
.mbar{height:8px;background:#fff;border-radius:99px;margin-top:8px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.tile{position:relative}.tile .nb{position:absolute;top:12px;right:12px;font-style:normal;background:#e5484d;color:#fff;font-size:10.5px;font-weight:900;border-radius:99px;padding:2px 7px}
.cal-d{background:none;font-family:inherit;position:relative}.cal-d em{position:absolute;bottom:-1px;font-style:normal;font-size:8px;font-weight:700;color:#ffe98a;opacity:.9}
.cal-d.sel{outline:2.5px solid #e0a82e;outline-offset:1px}
.msum{display:flex;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.msum div{flex:1;text-align:center}.msum b{display:block;font-size:17px;font-weight:900}.msum span{font-size:12px;color:var(--sub)}
.dayrec{margin-top:12px;background:#fdf9e8;border-radius:14px;padding:12px 14px}.dayrec .diary:first-of-type{border-top:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:52}
.confetti i{position:absolute;top:-16px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(540deg) translateX(30px)}}
.cel-title{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffe98a;color:var(--ink);font-weight:900;font-size:14px;padding:9px 16px;border-radius:99px;z-index:53;white-space:nowrap;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.cert.new .medal{animation:spinIn .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes spinIn{from{transform:scale(.2) rotate(-200deg);opacity:0}}
.cheer{width:100%;max-width:320px;background:#fff;border-radius:24px;padding:26px 22px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.cheer h3{font-size:21px;font-weight:900;margin-top:12px}
.big-stamp{width:104px;height:104px;margin:0 auto;border-radius:50%;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;font-weight:900;line-height:1;transform:rotate(-10deg);box-shadow:0 0 0 6px #fff4c2;animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
.big-stamp small{font-size:10px;letter-spacing:2px;color:#ffe98a;margin-bottom:4px}.big-stamp em{font-style:normal;font-size:12px;margin-top:4px;color:#ffe98a}
@keyframes stampIn{from{transform:scale(2.4) rotate(-30deg);opacity:0}}
.quote{background:#fff8d6;border-radius:14px;padding:16px;margin-top:16px;font-size:15px;font-weight:700;line-height:1.5;color:var(--ink)}
.goal{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.goal:first-of-type{border-top:none}
.goal .gm svg{display:block}.goal:not(.done) .gm svg{filter:grayscale(1);opacity:.35}
.goal .gi{flex:1;min-width:0}.goal .gi b{font-size:14.5px}.goal .gi span{font-size:12px;color:var(--sub)}.goal .bar{margin:6px 0 4px;height:8px}
.goal.done .bar i{background:#f0679f}.goal.ended{opacity:.6}
.mission-card{background:#fff8d6;border-color:#f3e3a0}.mc-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}.mc-top b{display:block;font-size:17px;font-weight:900;margin:2px 0}
.mission-card .bar i{background:var(--ink)}
.scope{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}

.scope button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.course .cmap{border-radius:14px;overflow:hidden}.maplinks .btn{text-align:center;text-decoration:none;font-size:13px;padding:12px 6px}

 S.games.forEach(g=>w.push({date:g.date,time:g.time||'12:00',sport:g.sport,weather:g.weather,min:0}));
 return w.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const studies=()=>S.posts.filter(p=>p.kind==='study').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const dailies=()=>S.posts.filter(p=>p.kind==='daily').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const uniqDates=list=>[...new Set(list.map(x=>x.date))].sort();
function godDays(){const s=new Set(studies().map(x=>x.date));return uniqDates(workouts()).filter(d=>s.has(d))}
function triDays(){const s=new Set(studies().map(x=>x.date)),d=new Set(dailies().map(x=>x.date));return uniqDates(workouts()).filter(x=>s.has(x)&&d.has(x))}
/* 조건 도우미: 조건이 처음 맞은 날짜를 돌려줘요 */
const nth=(list,n)=>list.length>=n?(list[n-1].date||list[n-1]):null;
const dOf=x=>x.date||x;
function firstGroupWith(list,n,key){const c={};for(const x of list){const k=key(dOf(x));c[k]=(c[k]||0)+1;if(c[k]===n)return dOf(x)}return null}
const firstMonthWith=(l,n)=>firstGroupWith(l,n,d=>d.slice(0,7));
const firstWeekWith=(l,n)=>firstGroupWith(l,n,weekIdx);
function streakWeeks(list,k){const ws=[...new Set(list.map(x=>weekIdx(dOf(x))))].sort((a,b)=>a-b);let run=1;for(let i=1;i<ws.length;i++){run=ws[i]===ws[i-1]+1?run+1:1;if(run>=k){const w=ws[i];return dOf(list.find(x=>weekIdx(dOf(x))===w))}}return k<=1&&ws.length?dOf(list[0]):null}
function streakDays(dates,k){const ds=[...new Set(dates)].sort();let run=1;if(k<=1&&ds.length)return ds[0];for(let i=1;i<ds.length;i++){const gap=(new Date(ds[i])-new Date(ds[i-1]))/864e5;run=gap===1?run+1:1;if(run>=k)return ds[i]}return null}
function distinctNth(list,key,n){const s=new Set();for(const x of list){s.add(key(x));if(s.size>=n)return dOf(x)}return null}
function windowWith(list,days,n){const ds=list.map(dOf).sort();for(let i=n-1;i<ds.length;i++){if((new Date(ds[i])-new Date(ds[i-n+1]))/864e5<=days-1)return ds[i]}return null}
function winStreak(games,k){let r=0;for(const g of games){r=g.result==='승'?r+1:0;if(r>=k)return g.date}return null}

 catch(e){if(e&&e.code==='invalid_argument')toast('보기 전용 권한이라 기록이 서버에 저장되지 않아요');else if(e&&e.code==='quota_exceeded')toast('저장 공간이 가득 찼어요')}

/* 암호화: 비밀번호로 만든 키로 기록 전체를 잠가서 저장해요 */
function b64e(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function encText(key,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt));return {iv:b64e(iv),ct:b64e(ct)}}
async function decText(key,iv,ct){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct)))}
function remember(id,key){crypto.subtle.exportKey('raw',key).then(raw=>{try{localStorage.setItem(AUTHKEY,JSON.stringify({id,k:b64e(raw)}))}catch(e){}}).catch(()=>{})}
function recall(){try{return JSON.parse(localStorage.getItem(AUTHKEY))}catch(e){return null}}
function forget(){try{localStorage.removeItem(AUTHKEY)}catch(e){}}

 const d=doc||await ACC.db.doc('accounts/'+id).get();if(!d.exists)throw {code:'noid'};
 const v=d.data();let txt;try{txt=await decText(key,v.iv,v.ct)}catch(e){throw {code:'badpw'}}
 S=normalize(JSON.parse(txt));ACC.id=id;ACC.key=key;ACC.salt=v.salt;ACC.local=false;UI.auth='done';UI.tab='home';
 checkProgress();save();render();rankInit();pushRank();
}

function bindDrag(){
 const svg=$('#bagEdit');if(!svg)return;
 const pt=e=>{const r=svg.getBoundingClientRect();return {x:BX+(e.clientX-r.left)/r.width*BW,y:(e.clientY-r.top)/r.height*BH}};
 svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.dg');if(!g){if(UI.sel!=null){UI.sel=null;render()}return}const i=+g.dataset.i;UI.sel=i;const p=pt(e),d=S.deco[i];drag={i,dx:d.x-p.x,dy:d.y-p.y,moved:false,g};svg.setPointerCapture(e.pointerId);e.preventDefault()});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),d=S.deco[drag.i];if(isKey(d)){d.x=Math.max(-22,Math.min(222,p.x+drag.dx));d.y=Math.max(4,Math.min(150,p.y+drag.dy))}else{d.x=Math.max(10,Math.min(190,p.x+drag.dx));d.y=Math.max(10,Math.min(190,p.y+drag.dy))}drag.moved=true;const im=drag.g.querySelector('image'),b=decoBox(d);im.setAttribute('x',b.x);im.setAttribute('y',b.y);const rc=drag.g.querySelector('rect');if(rc){rc.setAttribute('x',b.x-3);rc.setAttribute('y',b.y-3)}});
 const end=()=>{if(!drag)return;drag=null;save();render()};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}

const OOTD={mem:{},pend:{}};
const ootdKey=d=>KEY+'.ootd.'+(ACC.id||'local')+'.'+d;
async function ootdPut(date,data){
 OOTD.mem[date]=data;try{localStorage.setItem(ootdKey(date),data)}catch(e){}
 if(ACC.id&&ACC.db&&ACC.key){try{const e=await encText(ACC.key,data);await ACC.db.doc('ootd/'+ACC.id+'--'+date).set({iv:e.iv,ct:e.ct,updated:Date.now()})}catch(e){}}
}
function ootdGet(date){
 if(OOTD.mem[date]!==undefined)return OOTD.mem[date];
 let v=null;try{v=localStorage.getItem(ootdKey(date))}catch(e){}
 if(v){OOTD.mem[date]=v;return v}
 if(ACC.id&&ACC.db&&ACC.key&&!OOTD.pend[date]){OOTD.pend[date]=1;ACC.db.doc('ootd/'+ACC.id+'--'+date).get().then(async d=>{if(!d.exists){OOTD.mem[date]=null;return}const x=d.data();const t=await decText(ACC.key,x.iv,x.ct);OOTD.mem[date]=t;try{localStorage.setItem(ootdKey(date),t)}catch(e){}if(UI.tab==='cal')render()}).catch(()=>{OOTD.mem[date]=null})}
 return null;
}

function drawRunGraph(){
 const el=$('#rgraph');if(!el||!S.runs.length)return;const d=new Date();const ms=[];for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}
 const v=ms.map(m=>S.runs.filter(r=>r.date.startsWith(m)).reduce((a,r)=>a+r.km,0)),mx=Math.max(...v,1),W=360,H=140,bw=W/6;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">${v.map((x,i)=>`<rect x="${(i*bw+bw*.22).toFixed(1)}" y="${(H-24-x/mx*(H-44)).toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${(x/mx*(H-44)).toFixed(1)}" rx="3" fill="${i===5?'#e0a82e':NAVY}"/><text x="${(i*bw+bw/2).toFixed(1)}" y="${(H-28-x/mx*(H-44)).toFixed(1)}" font-size="10" text-anchor="middle" fill="#1c2654">${x?x.toFixed(1):''}</text><text x="${(i*bw+bw/2).toFixed(1)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#6c7088">${+ms[i].slice(5)}월</text>`).join('')}</svg>`;
}

function teamPackRules(sp,pos,mode,weather){
 const last=S.games.filter(g=>g.sport===sp&&g.ai&&g.ai.packAdd).sort((a,b)=>b.date.localeCompare(a.date))[0];
 const r=packRules([],weather==='추움'?'추움':weather==='더움'?'더움':weather,last?last.ai.packAdd:[]);
 const L=[...TEAM_GEAR[sp].base,...(TEAM_GEAR[sp].pos[pos]||[])].map(n=>({name:n,why:''}));
 if(mode==='game')[['유니폼','경기날'],['여벌 양말',''],['이온음료','후반 대비']].forEach(([n,w])=>L.push({name:n,why:w}));
 r.items.forEach(x=>{if(!L.some(y=>y.name===x.name))L.push(x)});

}

 <div class="card"><h3>내 가방 · 용도</h3><div class="muted" style="margin-bottom:10px">지금: ${typeName()} · 가방 하나에 용도 하나</div>${bagListHTML()}</div>
 <div class="card"><h3>주로 하는 운동</h3><div class="chips">${[...SPORTS,'없음'].map(s=>`<button class="chip ${S.sports.includes(s)?'on':''}" data-a="profSport" data-v="${s}">${s}</button>`).join('')}</div></div>

 ${S.todayCustom.length?`<div class="card"><h3>직접 추가한 오늘의 상황</h3>${S.todayCustom.map(t=>`<span class="tag" style="margin:4px 4px 0 0">${esc(t)} <button data-a="rmToday" data-v="${esc(t)}">✕</button></span>`).join('')}</div>`:''}
 <button class="btn" data-a="tab" data-v="home">완료</button></div>`;
}

/* ===================== 축하 · 응원 · 기록증 ===================== */
function confetti(){const c=['#1c2654','#ffe98a','#a9d3ee','#f0679f','#3fae7f','#e0a82e'];let h='';for(let i=0;i<46;i++)h+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${c[i%c.length]};animation-delay:${(Math.random()*.7).toFixed(2)}s;animation-duration:${(2+Math.random()*1.4).toFixed(2)}s"></i>`;return `<div class="confetti">${h}</div>`}
function showCheer(label,next){
 const at=attendStats(),q=QUOTES[Math.floor(Math.random()*QUOTES.length)];window._afterCheer=next;
 $('#layer').innerHTML=`<div class="modal-bg" data-a="cheerOk"><div class="cheer" data-stop><div class="big-stamp"><small>MEGO</small>${+todayStr().slice(8)}<em>${esc(label)}</em></div>
  <h3>${label==='출석'?'출석 도장 꾹!':esc(label)+' 도장 꾹!'}</h3><div class="muted">이번 달 ${at.month}일째 출석 · 누적 ${at.total}일</div><div class="quote">“${esc(q)}”</div><button class="btn accent" data-a="cheerOk">고마워요!</button></div></div>`;
}
function showCert(ids,isNew){
 const md=evalMedals();let i=0;if(isNew){ids.forEach(id=>{if(!S.seenMedals.includes(id))S.seenMedals.push(id)});save()}
 const show=()=>{const m=findMedal(ids[i]);if(!m)return;const e=md[m.id];if(!e){toast('아직이에요 · '+condOf(m));return}const more=ids.length>1&&i<ids.length-1;const on=S.deco.some(d=>d.id===m.id);
  $('#layer').innerHTML=`<div class="modal-bg" data-a="closeCert">${isNew?confetti()+`<div class="cel-title">축하해요! 새 메달${ids.length>1?` (${i+1}/${ids.length})`:''}</div>`:''}<div class="cert ${isNew?'new':''}" data-stop>
   <div class="k">MEGO MOVE · ${esc(MCATS[m.cat])} · ${m.tier}</div><div class="title">${esc(m.name)}</div><div class="medal">${medalArt(m,130,{ribbon:true})}</div><div class="recsub">${esc(condOf(m))}</div>
   <div class="foot"><div>NAME<b>${esc(S.nick)}</b></div><div style="text-align:right">DATE<b>${e}</b></div></div></div></div>
  <div class="modal-actions"><button class="btn light" data-a="${more?'certNext':'closeCert'}">${more?'다음':'닫기'}</button><button class="btn accent" data-a="${on?(more?'certNext':'closeCert'):'certBag'}" data-v="${m.id}">${on?'가방에 달려 있어요':'가방에 달기'}</button></div>`};
 window._certNext=()=>{i++;show()};window._certMore=()=>ids.length>1&&i<ids.length-1;show();
}
function addDeco(type,id,style){
 if(S.deco.some(d=>d.id===id)){const i=S.deco.findIndex(d=>d.id===id);UI.sel=i;return true}
 if(S.deco.length>=8){toast('한 가방에 8개까지 달 수 있어요');return false}
 {const nd={type,id,style:style||'pin',size:'m',x:50+Math.random()*100,y:50+Math.random()*90};if(isKey(nd)){nd.x=S.deco.filter(isKey).length%2?20:180;snapKey(nd)}S.deco.push(nd)}UI.sel=S.deco.length-1;if(!S.decoAt)S.decoAt=todayStr();save();return true;
}

/* ===================== 동작 ===================== */
/* ===== 후기 요약 (규칙 기반) ===== */
const ISSUE=[
 {k:'수납',re:/수납|공간|좁|작아|작다|안 들어|칸|주머니/,s:'안쪽 칸이나 작은 주머니 추가 검토'},
 {k:'무게',re:/무거|무게|무겁/,s:'원단·부자재 무게 줄이기 검토'},
 {k:'착용감',re:/어깨|끈이|배겨|흘러내|쓸려|착용/,s:'끈 폭을 넓히거나 패드 추가 검토'},
 {k:'디자인',re:/디자인|색깔|색상|예쁘|촌스|로고/,s:'색상·로고 위치 의견 다시 모으기'},
 {k:'튼튼함',re:/찢|뜯|해지|올이|구멍|약해|터졌|실밥|내구/,s:'박음질·원단 두께 보강 검토'},
 {k:'젖은 짐·세탁',re:/젖|물기|냄새|세탁|빨래|축축/,s:'젖은 짐 분리용 파우치를 함께 주는 방안 검토'},
 {k:'입구·끈 조임',re:/조임|입구|스트링|풀려|안 닫/,s:'끈 조임 방식·스토퍼 개선 검토'}
];
function doTeamSummary(){
 const all=UI.reviews&&UI.reviews.length?UI.reviews:S.diaries;
 if(!all.length){UI.teamAI={oneLine:'아직 모인 일기가 없어요.',top3:[],keep:''};render();return}
 const avg=k=>{const v=all.map(r=>r.ratings&&+r.ratings[k]).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
 const sc=ISSUE.map(i=>{const bad=all.filter(r=>i.re.test(r.bad||'')).length,good=all.filter(r=>i.re.test(r.good||'')).length,a=RATING_ITEMS.includes(i.k)?avg(i.k):null;
  return {...i,bad,good,a,score:bad*2+(a!=null?(5-a)*all.length/5:0),kscore:good*2+(a!=null?a*all.length/5:0)}});
 const lab=x=>x.k+(x.a!=null?` (평균 ${x.a.toFixed(1)}점)`:'');
 const top=sc.filter(x=>x.bad||(x.a!=null&&x.a<4)).sort((a,b)=>b.score-a.score).slice(0,3);
 const kp=sc.filter(x=>x.good||(x.a!=null&&x.a>=4)).sort((a,b)=>b.kscore-a.kscore)[0];
 UI.teamAI={oneLine:top.length?`가장 아쉬운 부분은 '${top[0].k}'이에요.`:'크게 아쉬운 점이 아직 없어요.',
  top3:top.map(x=>({issue:`${lab(x)} · 아쉬운 점 ${x.bad}건`,suggestion:x.s})),keep:kp?`${lab(kp)} · 좋았던 점 ${kp.good}건`:''};
 render();
}

document.addEventListener('click',e=>{

  case 'join':{const n=$('#nick').value.trim();if(!UI.pickUses.length){toast('이 가방을 어디에 쓸지 골라 주세요');return}if(!n){toast('닉네임을 적어 주세요');return}S.uses=[UI.pickUses[0]];if(!S.uses.includes('workout'))UI.pickSports=[];S.nick=n;S.gender=UI.pickGender;S.sports=[...UI.pickSports];S.bags=[{line:UI.pickLine,color:UI.pickColor,use:UI.pickUses[0],deco:[]}];useBag(0);S.joined=todayStr();save();UI.tab='home';render();pushRank();showCert(['mg0'],true);break}

  case 'addBagCancel':UI.addBag=false;render();break;
  case 'addBagOk':{if(!UI.pickUses.length){toast('이 가방을 어디에 쓸지 골라 주세요');return}const before=evalMedals();S.bags.push({line:UI.pickLine,color:UI.pickColor,use:UI.pickUses[0],deco:[]});fixBagUses();if(S.bags.length>=2&&!S.collectorAt)S.collectorAt=todayStr();useBag(S.bags.length-1);UI.addBag=false;UI.tab='home';save();render();const aM=evalMedals(),nw=allMedals().filter(m=>aM[m.id]&&!before[m.id]).map(m=>m.id);if(nw.length)showCert(nw,true);else toast('가방을 추가했어요');break}
  case 'checkin':{const before=evalMedals();if(!S.checkins.includes(todayStr()))S.checkins.push(todayStr());afterSave(before,'출석');break}
  case 'cheerOk':{$('#layer').innerHTML='';const f=window._afterCheer;window._afterCheer=null;if(f)f();break}
  case 'vKind':case 'vSport':case 'vPlace':case 'vWeather':{UI.verify=UI.verify||{};const key={vKind:'kind',vSport:'sport',vPlace:'place',vWeather:'weather'}[a];keepVerifyInputs();UI.verify[key]=v;render();break}
  case 'rate':{const [k,n]=v.split('|');UI.ratings[k]=UI.ratings[k]===+n?0:+n;if(!UI.ratings[k])delete UI.ratings[k];document.querySelectorAll('[data-a="rate"]').forEach(b=>{const [bk,bn]=b.dataset.v.split('|');if(bk===k)b.classList.toggle('on',+bn<=(UI.ratings[k]||0))});break}
  case 'saveVerify':{keepVerifyInputs();const x=UI.verify||{},k=x.kind||'workout';if(k==='workout'&&!x.sport){toast('운동 종류를 골라 주세요');return}
   const before=evalMedals();const p={id:uid(),date:todayStr(),time:nowHM(),kind:k,weather:x.weather||'맑음'};
   if(k==='workout'){p.sport=x.sport;p.minutes=+x.minutes||0}if(k==='study'){p.place=x.place||'etc';p.minutes=+x.minutes||0}if(k==='daily'){p.trip=!!x.trip;if(x.thumb){p.photo=true;ootdPut(p.date,x.big||x.thumb)}}
   S.posts.push(p);collectDiary(k);UI.verify=null;afterSave(before,{workout:'운동',study:'공부',daily:'데일리룩'}[k]);break}
  case 'pSport':{UI.packSched=$('#pSched').value;const l=UI.packSports||[...S.sports];const i=l.indexOf(v);i>=0?l.splice(i,1):l.push(v);UI.packSports=l;render();break}
  case 'pWeather':UI.packSched=$('#pSched').value;UI.packWeather=v;render();break;
  case 'today':{if($('#pSched'))UI.packSched=$('#pSched').value;const i=UI.todaySel.indexOf(v);i>=0?UI.todaySel.splice(i,1):UI.todaySel.push(v);render();break}
  case 'todayAdd':{UI.packSched=$('#pSched').value;const x=$('#todayAdd').value.trim();if(!x)break;if(![...TODAY_OPTS,...S.todayCustom].includes(x)){S.todayCustom.push(x);save()}if(!UI.todaySel.includes(x))UI.todaySel.push(x);render();break}
  case 'pack':doPack();break;
  case 'chk':UI.checks[v]=!UI.checks[v];render();break;
  case 'calMove':{const [y,m]=(UI.calYM||todayStr().slice(0,7)).split('-').map(Number);const d=new Date(y,m-1+(+v),1);UI.calYM=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
